# Scheduled refresh of the FDC projection. It opens a pull request rather than
# committing to main, and it FAILS LOUDLY if the refreshed data does not
# validate — shipping data that does not validate is worse than shipping stale
# data that does.
name: refresh-fdc

on:
  schedule:
    - cron: '0 3 1 */3 *' # 03:00 UTC, first of the month, quarterly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install poppler for the factor-table transcription
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch and rebuild the FDC projection
        run: |
          pnpm fdc:fetch
          pnpm fdc:build

      - name: Validate — fail loudly rather than ship data that does not validate
        run: pnpm data:validate

      - name: The engine must still agree with the refreshed data
        run: pnpm test:run

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: refresh-fdc
          title: 'data: refresh the FDC projection'
          commit-message: |
            data: refresh the FDC projection

            Regenerated by the scheduled refresh-fdc workflow. data:validate and
            the test suite passed against the refreshed data.
          body: |
            Regenerated `data/ingredients/table.json` from the FDC bulk CSV.

            `pnpm data:validate` and `pnpm test:run` both passed against the
            refreshed data — this PR would not exist otherwise.

            Check the diff for values that moved, and for gaps that appeared or
            closed. A newly appearing gap is not a regression; it means FDC
            withdrew a value, and it must stay named.
          add-paths: |
            data/ingredients/table.json
